name: Tesztek

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # rögzítve: az ubuntu-latest 2026.10.19-től Ubuntu 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
