name: Tesztek

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04  # rögzítve: az ubuntu-latest 2026.10.19-től Ubuntu 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # A ruff verziója egy helyen van pinelve: a requirements-dev.txt-ben.
      - run: pip install "$(grep -o '^ruff==[^ ]*' requirements-dev.txt)"
      - run: ruff check --output-format=github .

  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # mindkét verzió eredménye látsszon, akkor is, ha az egyik bukik
      matrix:
        # 3.12: a fejlesztői gép; 3.13: a korábbi CI-verzió
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
