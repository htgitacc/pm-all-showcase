  - pmi: Project Charter
    prince2: (a PID része)
    note: A PRINCE2 nem kezeli külön dokumentumként
  - pmi: Project Management Plan
    prince2: PID — Project Initiation Documentation
    note: A Charter és a PM Plan együtt
  - pmi: Sponsor (szponzor)
    prince2: Executive
