# PRINCE2 — módszertani kiegészítés.
# Ez a réteg NEM módosítja a PMI-gerincet: a 69 dokumentum, a checklist és a
# dokumentumtérkép változatlan. A PRINCE2 külön oldalon és fázisonkénti,
# jelölt blokkokban jelenik meg.

primer_file: docs/prince2/00-prince2-osszefoglalo.md

intro: |
  A **PRINCE2** (*PRojects IN Controlled Environments*) egy **irányítási
  módszer**: előírja, kik a szereplők, milyen döntési pontokon kell a
  projektnek átmennie, és ki mit dönthet el.

  **Nem versenyez a PMI-val.** A PMI azt mondja meg, *mit tudjon* a
  projektmenedzser; a PRINCE2 azt, *hogyan irányítsuk* a projektet. A PRINCE2
  szinte semmilyen technikát nem tartalmaz — nincs benne becslési módszer,
  Gantt-diagram vagy elkészültségi érték. Ezeket a PMI eszköztárából kell hozni.

  > **Ez a felület PMI/PMBOK alapú.** A PRINCE2 itt **kiegészítő rétegként**
  > jelenik meg: a fázisoldalakon jelölt blokkban, itt pedig önálló
  > összefoglalóval és négy mintadokumentummal. A PMI-gerinc változatlan.

how_to_read: |
  1. **Kezdd az összefoglalóval** (letölthető alább) — kb. 10 oldal, és
     mindent tartalmaz, ami a fogalmak megértéséhez kell.
  2. **A fázisoldalakon** a *PRINCE2-kiegészítés* blokk mutatja, hogy az adott
     PMI-fázis melyik PRINCE2-folyamatnak felel meg, és mit tenne hozzá.
  3. **A négy mintadokumentum** (lent) azt mutatja meg, hogyan nézne ki
     ugyanez a Xyo-projekt PRINCE2 szerint.

principles:
  - name_hu: Folyamatos üzleti indokoltság
    name_en: Continued business justification
    text: >
      Az üzleti indoklás élő dokumentum. Minden szakaszhatáron újra megkérdezzük:
      megéri-e még? Ha nem, a projektet le kell állítani.
  - name_hu: Tanulás a tapasztalatokból
    name_en: Learn from experience
    text: >
      A tanulságokat a projekt elején keressük (korábbi projektekből), közben
      gyűjtjük, a végén átadjuk.
  - name_hu: Meghatározott szerepek és felelősségek
    name_en: Defined roles and responsibilities
    text: >
      Mindenki tudja, ő mit dönthet el, és mit nem. Nevesített szerepek,
      nem beosztások.
  - name_hu: Szakaszokban történő irányítás
    name_en: Manage by stages
    text: >
      A projektet irányítási szakaszokra bontjuk. Minden szakasz végén a
      döntéshozó testület engedélyezi vagy leállítja a folytatást.
  - name_hu: Kivételalapú irányítás
    name_en: Manage by exception
    text: >
      A PM toleranciákat kap, és azokon belül önállóan dolgozik. Csak akkor kell
      felfelé fordulnia, ha a tolerancia túllépése fenyeget.
  - name_hu: Termékközpontúság
    name_en: Focus on products
    text: >
      Nem tevékenységeket tervezünk, hanem termékeket (eredményeket), leírással
      és minőségi kritériummal.
  - name_hu: Testreszabás
    name_en: Tailor to suit the project
    text: >
      A módszert a projekt méretéhez és kockázatához kell igazítani.
      A „mindent dokumentálunk" nem PRINCE2, hanem félreértés.

processes:
  - code: SU
    name_hu: Projekt előkészítése
    name_en: Starting up a Project
    who: leendő PM + Executive
    what: >
      Van-e értelme egyáltalán elindítani? Elkészül a Project Brief és a
      kezdeményezési szakasz terve. Ez még nem a projekt — ez az előszoba.
  - code: DP
    name_hu: Projekt irányítása
    name_en: Directing a Project
    who: Project Board
    what: >
      Végig fut a projekt egészén. A Board engedélyez: kezdeményezést, projektet,
      minden szakaszt, végül a zárást. Kivételes helyzetben itt dönt.
  - code: IP
    name_hu: Projekt kezdeményezése
    name_en: Initiating a Project
    who: Project Manager
    what: >
      Elkészül a PID — a projekt „szerződése". Ez maga is egy szakasz,
      saját engedéllyel.
  - code: CS
    name_hu: Szakasz irányítása
    name_en: Controlling a Stage
    who: Project Manager
    what: >
      A napi munka: munkacsomagok kiadása, haladás követése, problémakezelés,
      Highlight Report a Boardnak.
  - code: MP
    name_hu: Termékszállítás irányítása
    name_en: Managing Product Delivery
    who: Team Manager
    what: >
      A munkacsomag elfogadása, elkészítése, átadása. Checkpoint Report a PM-nek.
  - code: SB
    name_hu: Szakaszhatár kezelése
    name_en: Managing a Stage Boundary
    who: Project Manager
    what: >
      A szakasz lezárása: End Stage Report, a következő szakasz terve, és
      a Business Case felülvizsgálata.
  - code: CP
    name_hu: Projekt lezárása
    name_en: Closing a Project
    who: Project Manager
    what: >
      Átadás, End Project Report, tanulságok, a haszonmérés terve.

roles:
  - role: Executive
    role_hu: Ügyvezető szerep
    represents: Az üzletet és a pénzt
    responsible: >
      Egyetlen ember. Ő birtokolja az üzleti indoklást, és ő hozza a végső
      döntést. A Board nem demokrácia.
    xyo: Kovács Anita, gazdasági igazgató
  - role: Senior User
    role_hu: Felhasználói vezető
    represents: A felhasználókat
    responsible: >
      A megoldás használhatósága, és hogy a hasznok ténylegesen megjelenjenek.
    xyo: Nagy Péter, IT osztályvezető — nálunk ő „a hasznok gazdája"
  - role: Senior Supplier
    role_hu: Szállítói vezető
    represents: A szállítót, kivitelezőt
    responsible: A megoldás megvalósíthatósága és leszállítása.
    xyo: Cloudia Solutions Kft. ügyfélkapcsolati vezetője
  - role: Project Manager
    role_hu: Projektmenedzser
    represents: —
    responsible: A napi irányítás, a toleranciákon belül.
    xyo: Tóth Gergő
  - role: Team Manager
    role_hu: Csapatvezető
    represents: Egy szakértői csapatot
    responsible: Egy-egy munkacsomag leszállítása.
    xyo: Szabó Márk (belső), Cloudia projektvezető (külső)
  - role: Project Assurance
    role_hu: Projektbiztosítás
    represents: A Boardot
    responsible: >
      Független ellenőrzés: a PM-től függetlenül nézi, hogy a projekt tényleg
      úgy áll-e, ahogy a riport mondja.
    xyo: "NEM VOLT — a legnagyobb hiányzó elem a valós projektben"
  - role: Change Authority
    role_hu: Változási hatáskör
    represents: A Board delegáltja
    responsible: A változáskérelmek eldöntése egy értékhatárig.
    xyo: Tóth Gergő, 1 000 000 Ft-ig — ez már most PRINCE2-szerű delegálás
  - role: Project Support
    role_hu: Projekttámogatás
    represents: —
    responsible: Adminisztráció, dokumentumkezelés, eszközök.
    xyo: Nincs — a projekt mérete nem indokolja

tolerances:
  intro: >
    A Board minden szakaszhoz toleranciát ad. A PM ezeken belül önállóan
    dolgozik — nem kell engedélyt kérnie. Ha a túllépés előrejelezhető,
    Exception Reportot készít.
  areas:
    - area: Idő
      xyo: ± 5 munkanap szakaszonként
    - area: Költség
      xyo: ± 5%, és a tartalékból 1 000 000 Ft / eset
    - area: Hatókör
      xyo: nulla — csak jóváhagyott változáskérelemmel
    - area: Minőség
      xyo: az átvételi kritériumok tűréshatára; S1 hibából nulla
    - area: Kockázat
      xyo: 6-os besorolás felett jelenteni kell
    - area: Haszon
      xyo: a mérőszámok kudarcküszöbe

