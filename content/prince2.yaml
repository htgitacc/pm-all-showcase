    note: Termékalapú tervezés, nem tevékenységalapú
  - pmi: Change Request
    prince2: Issue
    note: PRINCE2 egy folyamatban kezeli a változást és a problémát
  - pmi: Issue Log
    prince2: Issue Register
    note: Lényegében azonos
  - pmi: Risk Register
    prince2: Risk Register
    note: Azonos
  - pmi: Lessons Learned Register
    prince2: Lessons Log / Lessons Report
    note: PRINCE2-ben a projekt elején is keresünk tanulságokat

when_prince2:
  - Több szervezet vagy szállító vesz részt
  - Közszféra, pályázat, szabályozott környezet
  - A döntéshozók távol vannak a napi munkától
  - Bizonytalan a megtérülés — élő kérdés, hogy megéri-e még
  - Hosszú, több szakaszban futó projekt
  - Erős elszámoltathatósági igény

when_pmi:
  - A projektmenedzser eszköztárát kell fejleszteni
  - Egy szervezeten belüli projekt, közeli szponzorral
  - Technikai tervezési kérdések dominálnak
  - Nemzetközi, USA-orientált környezet

combined: |
  **A leggyakoribb valós helyzet: mindkettőre szükség van.**

  | Réteg | Honnan |
  |---|---|
  | Kormányzás: szerepek, szakaszok, toleranciák, üzleti indokoltság | **PRINCE2** |
  | Technikák: becslés, ütemterv, kockázatelemzés, EVM, beszerzés | **PMI / PMBOK** |

  Ez nem kompromisszum, hanem a két módszertan szándéka szerinti használat:
  a PRINCE2 kifejezetten arra számít, hogy a technikákat máshonnan hozod.

  **Amikor egyik sem való:** ha a követelmények menet közben derülnek ki és a
  szállítás folyamatos (tipikusan szoftverfejlesztés), akkor agilis
  keretrendszer illik jobban.

xyo_stages:
  intro: >
    A Xyo Cloud Pilot PMI szerint készült, egyetlen formális kapuval
    (Planning-kapu, 2026.03.13.). PRINCE2-ben négy irányítási szakasz lett
    volna, mindegyik végén Board-döntéssel.
  stages:
    - num: 0
      name: Előkészítés (SU)
      period: 2025.11.10 – 2026.02.02.
      gate: Project Brief → a Board engedélyezi a kezdeményezést
    - num: 1
      name: Kezdeményezés (IP)
      period: 2026.02.02 – 03.13.
      gate: PID → a Board engedélyezi a projektet és a 2. szakaszt
    - num: 2
      name: Beszerzés
      period: 2026.03.16 – 04.17.
      gate: End Stage Report + a Business Case felülvizsgálata
    - num: 3
      name: Kialakítás és teszt
      period: 2026.04.20 – 06.19.
      gate: End Stage Report → engedély a zárásra
    - num: 4
      name: Élesítés és zárás (CP)
      period: 2026.06.22 – 06.30.
      gate: End Project Report + a haszonmérés terve

already_prince2:
  intro: >
    Öt dolgot a Xyo projektben már PRINCE2-szerűen csináltunk, anélkül hogy
    tudtunk volna róla.
  items:
    - what: 'E-04 eszkaláció: nem döntést kértem, hanem előre jeleztem a kockázatot és vállaltam egy visszajelzési időpontot'
      p2: Pontosan egy Exception Report logikája
    - what: A WBS eredményeket tartalmaz, nem tevékenységeket („50 db beüzemelt laptop")
      p2: Termékközpontúság (6. alapelv)
    - what: A WBS-szótár kész-definíciója minden munkacsomaghoz
      p2: A termékleírás minőségi kritériuma
    - what: A tanulságokat menet közben gyűjtöttük (19-ből 14)
      p2: Tanulás a tapasztalatokból (2. alapelv)
    - what: A PM 1 000 000 Ft-ig önállóan dönt a változásokról
      p2: Change Authority delegálás

would_add:
  intro: >
    És négy dolgot tett volna hozzá, amiből az első valódi hiány volt.
  items:
    - what: Project Assurance — független ellenőrzés a Board nevében
      gap: nagy
      note: A Steering kizárólag a PM riportjaira támaszkodott
    - what: Szakaszonkénti Business Case-felülvizsgálat
      gap: közepes
      note: A beszerzési megtakarítás után érdemes lett volna újra megnézni
    - what: Formális szakaszhatárok 4 helyen 1 helyett
      gap: közepes
      note: Fegyelmezettebb, de egy 5 hónapos projektnél nehézkes is lehet
    - what: Kimondott toleranciák hat területen
      gap: kicsi
      note: A Charter hatásköri szakasza ezt jórészt pótolta

verdict: |
  **Megérte volna a Xyo projektet PRINCE2 szerint csinálni? Részben.**

  Egy 50 fős, 5 hónapos, 45 M Ft-os, egy szervezeten belüli projektnél a teljes
  PRINCE2-apparátus **aránytalan lett volna** — és a 7. alapelv, a
  **testreszabás**, kifejezetten tiltja is az ilyet.

  **Amit érdemes lett volna átvenni:** a Project Assurance szerepet (akár egyetlen
  független személyt), a szakaszonkénti Business Case-felülvizsgálatot, és a
  kimondott toleranciákat.

  **A kiterjesztési projektnél viszont** (190 fő, kb. 133 M Ft, három hullám,
  2027 januártól szeptemberig) **a teljes PRINCE2-váz védhető** — ott már több
  szakasz, nagyobb tét és hosszabb futásidő van, ahol a „megéri-e még?" kérdés
  valóban élő.

documents:
  - id: p2_pid
    order: 1
    name_hu: Projekt-kezdeményezési dokumentáció
    name_en: PID — Project Initiation Documentation
    pmi: Project Charter + Projektterv együtt
    why: >
      A projekt „szerződése" a Project Manager és a Project Board között.
      Tartalmazza a célokat, a hatókört, a szervezetet, a szakaszolást, a
      toleranciákat, a megközelítéseket és a kontrollokat.
    sample_file: docs/prince2/01-pid.md
  - id: p2_highlight
    order: 2
    name_hu: Kiemelt állapotjelentés
    name_en: Highlight Report
    pmi: Státuszriport
    why: >
      Rendszeres jelentés a Boardnak — de a toleranciákhoz mérve, nem a tervhez.
      Amíg a PM a sávon belül van, a Boardnak nincs teendője.
    sample_file: docs/prince2/02-highlight-report.md
  - id: p2_exception
    order: 3
    name_hu: Kivételjelentés
    name_en: Exception Report
    pmi: (nincs megfelelő)
    why: >
      Akkor készül, amikor előrejelezhető a tolerancia túllépése — nem akkor,
      amikor már megtörtént. Négy döntési lehetőséget ad a Boardnak.
      Ez a legértékesebb elem, amit a PRINCE2-től át lehet venni.
    sample_file: docs/prince2/03-exception-report.md
  - id: p2_endstage
    order: 4
    name_hu: Szakaszzáró jelentés
    name_en: End Stage Report
    pmi: Fázis-kapu (de az opcionális)
    why: >
      Minden szakaszhatáron kötelező. Kimutatja a szakasz teljesítményét a
      toleranciákhoz mérve, és kötelezően felülvizsgálja az üzleti indoklást.
    sample_file: docs/prince2/04-end-stage-report.md
