    note: PRINCE2-ben kötelező szerepstruktúra
  - pmi: Fázis-kapu (phase gate)
    prince2: Szakaszhatár (stage boundary)
    note: PRINCE2-ben kötelező, és a Business Case felülvizsgálatával jár
  - pmi: Status Report
    prince2: Highlight Report
    note: A toleranciákhoz méri az állapotot, nem a tervhez
  - pmi: (nincs megfelelő)
    prince2: Exception Report
