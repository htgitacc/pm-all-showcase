# ITIL 4 — módszertani kiegészítés (csak a Xyo projektre).
# Ez a réteg NEM módosítja a PMI-gerincet és a Xyo-dokumentumokat: azt mutatja meg,
# hol kapcsolódik a projekt a szolgáltatásmenedzsmenthez, és mit tenne hozzá az ITIL 4.
# A szöveg saját megfogalmazás; az ITIL® a PeopleCert bejegyzett védjegye.

primer_file: docs/itil4/00-itil4-osszefoglalo.md
primer_caption: >
  Kb. 12 oldal: mi az ITIL 4, a Foundation minden fogalma a hivatalos angol névvel, hogyan
  kapcsolódik a projekthez, a Xyo ITIL-szemmel, a magyar szabályozási környezet és az ITIL 5.

# A mintadokumentumok: amit a Xyo-projekt nem készített el, a Xyo saját adataival.
# A `sources` a dokumentum-index azonosítói (a validálás ellenőrzi), a `practices` a
# Foundation-gyakorlatok azonosítói.
documents_caption: >
  Amit a Xyo-projekt nem készített el, de egy ITIL-szemléletű átadás része lenne — a Xyo saját
  adataival, szereplőivel és dátumaival. Mindegyik azt is megmutatja, miben más, mint a projekt
  hasonló dokumentuma.
documents:
  - id: itil_service_description
    order: 1
    name_hu: Szolgáltatásleírás és katalógus-bejegyzés
    name_en: Service description and service catalogue entry
    why: >
      A projekt végén a termékből szolgáltatás lesz. A Run-book azt írja le, mit kell üzemeltetni; a
      szolgáltatásleírás azt, mit kap a felhasználó és a cég — és mit nem. Itt válnak szét a Run-book
      „15 leggyakoribb esetében” a hibák és a kérések (10 incidens, 5 szolgáltatáskérés).
    teaches: haszon és garancia, szolgáltatásajánlat, kéréskatalógus, kizárások
    practices: [service_request_management, service_level_management, service_desk]
    sources: [operational_handover, as_built, user_guide, change_log, kpi_sheet, pir]
    sample_file: docs/itil4/01-szolgaltatasleiras.md
  - id: itil_sla_ola
    order: 2
    name_hu: SLA, OLA és alátámasztó szerződések
    name_en: Service level agreement, operational level agreement, underpinning contracts
    why: >
      A haszonmérés céljai a mérési szakasz végén lejárnak; az SLA tartós vállalássá alakítja őket —
      a négy mérési pont adataiból, nem hasból. Kiszámolja azt is, hol a Xyo határa: a három
      Microsoft-szolgáltatás együtt megengedett kiesése (69,1 perc) több, mint amennyit a belső
      99,5%-os cél egy szeptemberi hónapban megenged (62,7 perc).
    teaches: célszint adatból, súlyosság és prioritás, OLA a belső átadásokra, a beszállítói lánc
    practices: [service_level_management, supplier_management, service_desk]
    sources: [kpi_sheet, monthly_measurement_report, pir, operational_handover, contract, quality_plan]
    sample_file: docs/itil4/02-sla-ola.md
  - id: itil_change_model
    order: 3
    name_hu: Változásengedélyezési modell
    name_en: Change enablement — standard, normal and emergency change models
    why: >
      A Xyo változáskezelési eljárása a projekt hatókörét védi; az éles konfigurációra nincs
      szabálya. A modell szétválasztja a két kérdést („megéri-e?” és „biztonságos-e?”), a
      Változásnapló öt nem-CR módosítását besorolja, és a P-05 esetén megmutatja, hol előzte volna
      meg a hibát — és hol nem tett volna hozzá semmit.
    teaches: projekt-változáskezelés ≠ változásengedélyezés, szabványos változás, változásengedélyező
    practices: [change_enablement, service_configuration_management]
    sources: [change_procedure, change_log, issue_log, as_built, operational_handover, decision_log]
    sample_file: docs/itil4/03-valtozasengedelyezes.md
  - id: itil_incident_problem
    order: 4
    name_hu: Incidens → probléma → ismert hiba
    name_en: Incident, problem and known error — case tracking and records
    why: >
      A projekt a nyitott hibáit három helyen, három azonosítóval tartotta nyilván (H-xx, P-xx,
      Run-book eset). A minta összeköti őket, ismerthiba-nyilvántartást épít belőlük (négyből
      három lezárva a PIR-ig), a késő MFA-értesítésnek problémarekordot nyit mérhető kiváltó
      feltétellel, és pótolja a Run-bookból hiányzó kiemeltincidens-eljárást.
    teaches: a három fogalom határa, a névütközés, ismert hiba és kerülőmegoldás, kiemelt incidens
    practices: [incident_management, problem_management, service_desk]
    sources: [test_report, issue_log, operational_handover, rollback_plan, final_acceptance, user_survey, pir]
    sample_file: docs/itil4/04-incidens-problema-ismert-hiba.md
  - id: itil_acceptance_els
    order: 5
    name_hu: Szolgáltatási elfogadás és korai életszakasz-támogatás
    name_en: Service acceptance and early life support (hypercare)
    why: >
      A Xyo 26 átvételi kritériumából 11 a garanciáról, 4 az üzemeltethetőségről szólt — ez
      kiemelkedő. A minta hozzáteszi a szolgáltatási elfogadás tíz kritériumát (nyolc teljesült),
      számmal adja meg a hypercare kilépési küszöbét, és megmutatja, mit nem rögzítettek a
      projekt dokumentumai a kilépéskor.
    teaches: projekt kész ≠ szolgáltatás kész, ki dönt az üzembe vételről, mérhető ELS-kilépés
    practices: [release_management, service_desk, service_level_management]
    sources: [final_acceptance, operational_handover, wbs_dictionary, training_plan, raci, baseline_report, change_log]
    sample_file: docs/itil4/05-szolgaltatasi-elfogadas-els.md
  - id: itil_cir
    order: 6
    name_hu: Folyamatos fejlesztési nyilvántartás
    name_en: Continual improvement register (CIR)
    why: >
      A tanulságok a következő projektnek szólnak; a futó szolgáltatás fejlesztéseinek a zárás
      után nincs gazdája. A minta 11 tételt vesz fel gazdával, határidővel és mérőszámmal (a PIR,
      a kiterjesztési előfeltételek és az ITIL-minták nyitott pontjaiból), elválasztja a projektbe
      való fejlesztéseket, és egy tételen végigvezeti a hétlépéses fejlesztési modellt.
    teaches: tanulság ≠ fejlesztés, prioritás érték és ráfordítás szerint, a hétlépéses modell
    practices: [continual_improvement, relationship_management]
    sources: [lessons_learned, pir, rollout_recommendation, monthly_measurement_report]
    sample_file: docs/itil4/06-folyamatos-fejlesztesi-nyilvantartas.md

intro: |
  Az **ITIL 4** az IT-szolgáltatásmenedzsment legelterjedtebb keretrendszere. Nem
  projektmódszertan: azt írja le, **hogyan hoz létre egy szervezet értéket a szolgáltatásain
  keresztül** — a kialakítástól az üzemeltetésen át a folyamatos fejlesztésig.

  **Miért kell egy projektmenedzsernek?** Mert a projekt egyszer véget ér, a szolgáltatás nem.
  A Xyo Cloud Pilot 2026.06.30-án lezárult, de a felhőalapú munkahely azóta is működik, és
  minden nap valaki üzemelteti, támogatja és fejleszti. Az ITIL arról szól, ami a projekt
  *után* történik — és arról, hogy a projekt mit adjon át ahhoz, hogy ez jól menjen.

  > **Ez a felület PMI/PMBOK alapú.** Az ITIL 4 itt **kiegészítő rétegként** jelenik meg, a
  > PRINCE2-höz hasonlóan: külön oldalon és a fázisoldalak jelölt blokkjaiban. A PMI-gerinc és
  > a Xyo-dokumentumok változatlanok.

how_to_read: |
  1. **Alapok:** a Foundation-szint fogalmai — mit jelent az érték, a szolgáltatás, a négy
     dimenzió és a hét irányelv —, mindegyik a Xyo projekten megmutatva.
  2. **Értéklánc:** hová esik a projekt az ITIL szolgáltatási értékláncában, és két valós
     értékáram a Xyo-ból, lépésről lépésre.
  3. **Gyakorlatok:** a Foundation 15 gyakorlata — melyik volt jelen a Xyo projektben, és
     melyik hiányzott.
  4. **Szerepek és igazodás:** kell-e új ember, ki hozza a szakértelmet, kihez és mihez kell
     igazodni, és mit változtat ez a projekten.
  5. **Együtt:** hogyan működik a PMI, a PRINCE2 és az ITIL 4 egymás mellett — fogalomtár,
     átadási pontok, ütközések, és egy valós hiba útja a három módszertanon át.
  6. **Mérhető eredmény:** a Xyo 12 mérőszáma ITIL-szemmel, a belőlük levezetett SLA-célok, és
     amit eddig nem lehetett mérni — célként, nem kitalált eredményként.
  7. **Haladó szint és ITIL 5:** a haladó ITIL 4-modulok a Xyo-n, érettségi önbecslés
     gyakorlatonként, ISO-szabványok, az ITIL 5 változásai és tanúsítási rendje — és az ítélet.
  8. **Összefoglaló és minták:** letölthető, kb. 12 oldalas összefoglaló, és hat mintadokumentum
     a Xyo adataival — amit a projekt nem készített el, de egy ITIL-szemléletű átadás része lenne.

key_concepts:
  intro: >
    Az ITIL 4 alapgondolata: az értéket **nem a szolgáltató állítja elő és adja át**, hanem a
    szolgáltató és a fogyasztó **közösen hozza létre** (value co-creation). Egy laptop önmagában
    nem érték — az érték az, hogy a munkatárs otthonról is el tudja végezni a munkáját.
  items:
    - term_hu: Szolgáltatás
      term_en: Service
      text: >
        Az értékteremtés közös létrehozását lehetővé tevő eszköz: a fogyasztó által kívánt
        eredményeket segíti elő, anélkül hogy a fogyasztónak bizonyos költségeket és
        kockázatokat magának kellene kezelnie.
      xyo: >
        A „felhőalapú munkahely” szolgáltatás: a pénzügyes munkatárs dolgozhat otthonról, és
        nem kell törődnie a gép karbantartásával, a mentéssel vagy a jogosultságokkal.
    - term_hu: Kimenet és eredmény
      term_en: Output, outcome
      text: >
        A **kimenet** az, amit egy tevékenység előállít (kézzelfogható vagy nem). Az
        **eredmény** az, amit az érintett a kimenet segítségével elér. A szolgáltató
        kimeneteket ad; a fogyasztó eredményeket akar.
      xyo: >
        Kimenet: 50 beállított laptop, 50 Entra ID fiók. Eredmény: az új belépő 3,5 munkanap
        helyett 0,8 munkanap alatt áll munkába (M5, PIR).
    - term_hu: Haszon és garancia
      term_en: Utility, warranty
      text: >
        A **haszon** (célnak megfelelés) azt mondja meg, *mit* tud a szolgáltatás; a
        **garancia** (használatra alkalmasság) azt, hogy *mennyire megbízhatóan*: rendelkezésre
        állás, kapacitás, biztonság, folytonosság. Az értékhez mindkettő kell.
      xyo: >
        Haszon: közös dokumentumkezelés SharePointon, távoli elérés VPN-en. Garancia: 99,6%-os
        rendelkezésre állás (M9), 100%-os MFA-lefedettség (M8), nulla adatvesztés (M10).
    - term_hu: Költségek és kockázatok
      term_en: Costs, risks
      text: >
        Egy szolgáltatás egyes költségeket és kockázatokat **levesz** a fogyasztóról, másokat
        **rárak**. A jó szolgáltatásban a levett teher nagyobb, mint a rárakott.
      xyo: >
        Levett költség: az elavuló asztali géppark cseréje és karbantartása. Rárakott költség:
        a mobilnet és a licencek. Levett kockázat: az adatvesztés (M10: 0,75 → 0 eset
        negyedévente). Rárakott kockázat: a kizárás egy rossz feltételes hozzáférési szabály
        miatt (P-05).
    - term_hu: Szolgáltatásajánlat
      term_en: Service offering
      text: >
        Egy vagy több szolgáltatás formális leírása egy fogyasztói csoport számára. Három
        összetevője lehet: **javak** (átkerülnek a fogyasztóhoz), **hozzáférés erőforráshoz**
        (a tulajdon a szolgáltatónál marad) és **szolgáltatási tevékenységek** (amit a
        szolgáltató a fogyasztóért tesz).
      xyo: >
        Javak: laptop, dokkoló, otthoni monitor. Hozzáférés: Microsoft 365 licenc, SharePoint,
        VPN. Szolgáltatási tevékenységek: Service Desk, gépbeüzemelés, jelszó-visszaállítás.
    - term_hu: Szolgáltatási kapcsolat
      term_en: Service relationship
      text: >
        A szolgáltató és a fogyasztó együttműködése. Három része van: a **szolgáltatásnyújtás**,
        a **szolgáltatásigénybevétel** és a **kapcsolat kezelése**. A Xyo-ban egyszerre több
        kapcsolat él egymás mögött.
      xyo: >
        Az IT osztály szolgáltat a pilot-résztvevőknek, közben maga is fogyasztó: a Microsofttól
        (felhőszolgáltatás), a Cloudia Solutionstől (bevezetés, szavatosság) és a TechLine
        Zrt.-től (hardver, garanciális szerviz).
    - term_hu: Érintett szerepek a fogyasztói oldalon
      term_en: Customer, user, sponsor
      text: >
        A **megrendelő** (customer) határozza meg az igényt és felel az eredményért, a
        **felhasználó** használja a szolgáltatást, a **szponzor** engedélyezi a költséget.
        Lehet ugyanaz a személy, de gyakran nem az — és mást várnak.
      xyo: >
        Megrendelő: Horváth Júlia ügyvezető, a Projekt Irányító Bizottság elnöke. Felhasználók: az 50
        pilot-résztvevő. Szponzor: Kovács Anita gazdasági igazgató.

dimensions:
  intro: >
    Az ITIL szerint minden szolgáltatást négy nézőpontból kell egyszerre végiggondolni. Ha
    bármelyik kimarad, a szolgáltatás valahol akadozni fog — akkor is, ha a technika hibátlan.
  items:
    - name_hu: Szervezetek és emberek
      name_en: Organizations and people
      text: >
        Szervezeti felépítés, szerepek, kompetenciák, kultúra — ki csinálja, és tudja-e.
      xyo: >
        A Service Desk felkészítése (5.3), az oktatások (5 csoport), a home office szabályzat
        (HR), az üzemi tanács véleményezése. A PIR szerint a home office arány azért maradt a cél
        alatt (M6: 37% a ≥ 40% helyett), mert a vezetők nem egységesen alkalmazták a szabályzatot —
        ez ennek a dimenziónak a hiánya, nem technikai hiba.
    - name_hu: Információ és technológia
      name_en: Information and technology
      text: >
        Az információ, amit a szolgáltatás kezel, és a technológia, amire épül — beleértve az
        üzemeltetéshez szükséges tudást is.
      xyo: >
        Microsoft 365, Entra ID, Intune, SharePoint, Azure VPN; a konfiguráció leírása az
        as-built dokumentációban; a ticketadatok mint mérési forrás.
    - name_hu: Partnerek és beszállítók
      name_en: Partners and suppliers
      text: >
        A szervezet kapcsolatai más szervezetekkel, amelyek részt vesznek a szolgáltatás
        kialakításában, nyújtásában és fejlesztésében.
      xyo: >
        Microsoft (felhőszolgáltatás, CSP-n keresztül), Cloudia Solutions Kft. (bevezetés,
        szavatosság), TechLine Zrt. (laptopok, garanciális szerviz), a mobilszolgáltató.
    - name_hu: Értékáramok és folyamatok
      name_en: Value streams and processes
      text: >
        Hogyan működnek együtt a szervezet részei: milyen lépésekben jut el egy igény az
        értékig, és milyen tevékenységekből áll egy-egy munkafolyamat.
      xyo: >
        Az új belépő munkába állítása, a kilépő fiókjának lezárása, egy elveszett laptop
        kezelése — mindegyik végigmegy a HR-en, a Service Deskn és a rendszergazdán.
  external:
    intro: >
      A négy dimenzióra külső tényezők hatnak. Az ITIL a PESTLE-modellt használja: politikai,
      gazdasági, társadalmi, technológiai, jogi és környezeti tényezők.
    factors:
      - factor: Politikai
        xyo: A cloud-first irányt az IT részleg kezdeményezte, de a döntés a vezetésé (Steering, fázis-kapuk).
      - factor: Gazdasági
        xyo: A régi gépek elavulása, a folyó IT-költség (M12) és a licencárak alakulása.
      - factor: Társadalmi
        xyo: A home office elvárássá vált a munkaerőpiacon; a felhasználói ellenállás kockázata.
      - factor: Technológiai
        xyo: A Microsoft szolgáltatásainak folyamatos változása, amit a Xyo nem irányít.
      - factor: Jogi
        xyo: GDPR és adatvédelmi hatásvizsgálat, a munka törvénykönyve a távmunkáról, az EU-s adattárolás.
      - factor: Környezeti
        xyo: Kevesebb ingázás; a régi gépek szabályos selejtezése.

svs:
  intro: >
    A **Szolgáltatásérték-rendszer** (Service Value System, SVS) azt írja le, hogyan alakul át
    egy **lehetőség vagy igény** a szervezetben **értékké**. Öt eleme van; ezek közül a
    szolgáltatási értéklánc a gerinc.
  components:
    - name_hu: Irányelvek
      name_en: Guiding principles
      text: Mindig érvényes ajánlások, amelyek minden döntést vezérelnek (lásd lent, hét darab).
    - name_hu: Irányítás
      name_en: Governance
      text: >
        Az a mód, ahogy a szervezetet vezetik: értékel, irányt szab, figyel. A Xyo-ban az
        ügyvezetés és — a projekt idején — a Projekt Irányító Bizottság.
    - name_hu: Szolgáltatási értéklánc
      name_en: Service value chain
      text: >
        Hat összekapcsolt tevékenység, amelyekből az értékáramok felépülnek (lásd az Értéklánc
        fülön).
    - name_hu: Gyakorlatok
      name_en: Practices
      text: >
        Szervezeti erőforrások együttesei egy-egy feladat elvégzésére: emberek, folyamatok,
        eszközök, információ. Az ITIL 4 34 gyakorlatot ír le (lásd a Gyakorlatok fülön).
    - name_hu: Folyamatos fejlesztés
      name_en: Continual improvement
      text: >
        A szervezet minden szintjén zajló, visszatérő tevékenység, hogy a szolgáltatások és a
        gyakorlatok lépést tartsanak a változó igényekkel.

principles:
  - name_hu: Az értékre összpontosíts
    name_en: Focus on value
    text: >
      Mindennek, amit a szervezet tesz, közvetlenül vagy közvetve értéket kell teremtenie az
      érintetteknek. Ehhez tudni kell, ki a fogyasztó, és neki mi az érték.
    xyo: >
      A projekt célja nem 50 laptop kiosztása volt, hanem a hely-független munka és a gyorsabb
      munkába állás. Ezért mérte a haszonrealizálási terv az eredményeket (M1–M12), nem a
      kiosztott gépeket.
  - name_hu: Kezdd ott, ahol vagy
    name_en: Start where you are
    text: >
      Ne kezdj mindent elölről: mérd fel, ami már működik, és építs rá. Az elhamarkodott
      „tiszta lap” elpazarolja a meglévő értéket.
    xyo: >
      A T0 mérés (2026.01.30., még a Charter aláírása előtt) rögzítette a kiinduló állapotot, a meglévő Service Desk kapta a
      támogatást, nem egy új csapat. Az ITIL-bevezetés is így indulna: a runbook és a
      KPI-adatlap már megvan, ezekre lehet építeni.
  - name_hu: Haladj lépésenként, visszajelzéssel
    name_en: Progress iteratively with feedback
    text: >
      Bontsd a munkát kezelhető lépésekre, és minden lépés után kérj visszajelzést. Egy lépés
      is legyen önmagában értékes.
    xyo: >
      Három élesítési hullám (10, 20, 20 fő) az UAT visszajelzéseivel; maga a pilot is egy lépés
      a 190 fős kiterjesztés előtt.
  - name_hu: Működj együtt, és tedd láthatóvá a munkát
    name_en: Collaborate and promote visibility
    text: >
      A jó megoldás együttműködésből születik, és csak az látható munkára lehet jó döntést
      építeni. A rejtett munka rejtett kockázat.
    xyo: >
      A WBS közös workshopon készült (három csomag csak ott került elő), a runbook hibakezelési
      részét a Service Desk-vezetővel közösen írták, a pilot-kör kéthetente hírlevelet kapott.
  - name_hu: Gondolkodj és dolgozz egészben
    name_en: Think and work holistically
    text: >
      Egy szolgáltatás sem önálló: a négy dimenzió és a többi szolgáltatás együtt határozza
      meg, mi működik. A részek optimalizálása nem optimalizálja az egészet.
    xyo: >
      A projekt nem csak technika volt: HR-szabályzat, üzemi tanács, adatvédelem, mobilnet és
      oktatás is része lett. Ahol ez nem sikerült teljesen (a home office szabályzat vezetői
      alkalmazása), ott maradt el a haszon.
  - name_hu: Legyen egyszerű és gyakorlatias
    name_en: Keep it simple and practical
    text: >
      Ha egy lépés, szabály vagy dokumentum nem teremt értéket, hagyd el. Kevesebb lépés,
      kevesebb hiba.
    xyo: >
      Egy 50 fős pilotnál nem kell külön változástestületi ülés: elég egy heti tizenöt perces
      egyeztetés Nagy Péter és Szabó Márk között. Az ITIL-réteg minden javaslatát ehhez a
      mérethez szabjuk.
  - name_hu: Optimalizálj és automatizálj
    name_en: Optimize and automate
    text: >
      Előbb tedd egyszerűvé és hatékonnyá a munkát, és csak utána automatizáld. Egy rossz
      folyamat automatizálva csak gyorsabban rossz.
    xyo: >
      Az Autopilot a gépbeüzemelést 6,5 óráról 1,4 órára vitte le (M4), az önkiszolgáló
      jelszó-visszaállítás a hozzáférési ticketek arányát 41%-ról 17%-ra (M3). Egyik sem
      „magától” lett gyors: az Autopilot-folyamat külön munkacsomag volt (3.2.2), az
      önkiszolgáló visszaállítás pedig csak a P-03 javítása után működött (MFA nélkül nem ment).

value_chain:
  intro: >
    A **szolgáltatási értéklánc** hat tevékenységből áll. Nem sorrend, hanem építőkockák: egy
    **értékáram** (value stream) a tevékenységeket abban a sorrendben fűzi össze, ahogy egy
    adott igény eljut az értékig. Minden tevékenység több gyakorlatot is használhat.
  activities:
    - id: plan
      name_hu: Tervezés
      name_en: Plan
      text: Közös megértés a jövőképről, az állapotról és az irányról — a szolgáltatások és a gyakorlatok szintjén.
      xyo: A cloud-first irány, az üzleti indoklás, a projektterv és a kiterjesztési javaslat.
    - id: improve
      name_hu: Fejlesztés
      name_en: Improve
      text: A termékek, szolgáltatások és gyakorlatok folyamatos javítása minden értéklánc-tevékenységben.
      xyo: A havi mérések, a PIR és a tanulságok naplója.
    - id: engage
      name_hu: Bevonás
      name_en: Engage
      text: Az érintettek igényeinek megértése, átlátható együttműködés és jó kapcsolat velük.
      xyo: Az érintettelemzés, a kommunikációs terv, a hírlevelek, a Service Desk mint egyetlen kapcsolódási pont.
    - id: design_transition
      name_hu: Kialakítás és átadás
      name_en: Design and transition
      text: Gondoskodik róla, hogy a szolgáltatások folyamatosan megfeleljenek az elvárt minőségnek, költségnek és piaci időnek.
      xyo: A követelmények, a biztonsági alapkonfiguráció, a tesztek, a hullámok és az üzemeltetésbe adás.
    - id: obtain_build
      name_hu: Beszerzés és építés
      name_en: Obtain/build
      text: A szolgáltatás összetevőinek beszerzése vagy elkészítése, amikor és ahol szükséges.
      xyo: Az ajánlatkérés, a szerződések, a laptopok átvétele, a felhőkörnyezet konfigurálása.
    - id: deliver_support
      name_hu: Szolgáltatásnyújtás és támogatás
      name_en: Deliver and support
      text: A szolgáltatás nyújtása és támogatása a megállapodott előírások és az érintettek elvárásai szerint.
      xyo: A Service Desk, a hibakezelés, a rendszeres üzemeltetési feladatok — 2026.06.26-tól az üzemeltetés kezében.
  phase_map:
    intro: >
      A Xyo projekt hat fázisa így esik az értéklánc tevékenységeire. A projekt maga az ITIL
      **projektmenedzsment-gyakorlata** — a 34 gyakorlat egyike —, és főként a *Kialakítás és
      átadás*, valamint a *Beszerzés és építés* tevékenységet szolgálja.
    rows:
      - phase: initiation
        activities: [engage, plan]
        note: Az igény és a lehetőség megfogalmazása, az érintettek bevonása, a döntés a befektetésről.
      - phase: planning
        activities: [plan, design_transition]
        note: Mit és milyen minőségben kell átadni — a követelmények, az elfogadási kritériumok és a biztonsági alap.
      - phase: execution
        activities: [obtain_build, design_transition]
        note: Beszerzés, konfigurálás, tesztelés és a hullámokban történő átadás.
      - phase: monitoring
        activities: [improve, plan]
        note: Eltérések észlelése és korrekció — a projekt saját fejlesztési köre.
      - phase: closure
        activities: [design_transition, deliver_support]
        note: Az átadás pillanata — innen a szolgáltatás a Szolgáltatásnyújtás és támogatás része.
      - phase: benefits
        activities: [improve, engage]
        note: A haszon mérése és a tanulságok visszaforgatása; a kiterjesztés új Tervezés-kört indít.

value_streams:
  intro: >
    Két valós értékáram a Xyo üzemeltetéséből. Mindkettő több szervezeti egységen fut át —
    ezért egyetlen osztály folyamata sem írja le önmagában.
  items:
    - id: onboarding
      name: Új belépő munkába állítása
      trigger: A HR jelzi, hogy új munkatárs lép be (Varga Eszter).
      outcome: Az új munkatárs az első munkanapján dolgozni tud.
      metric: >
        M5 — munkába állásig eltelt idő: T0-ban 3,5 munkanap, a mérési szakasz végén 0,8
        munkanap (cél ≤ 1,0).
      steps:
        - activity: engage
          step: A HR szolgáltatáskérést rögzít a Service Desknél (név, szervezeti egység, kezdőnap).
          who: Varga Eszter → Kiss Réka
        - activity: obtain_build
          step: Fiók létrehozása az Entra ID-ban, licenc és csoporttagság hozzárendelése.
          who: Szabó Márk
        - activity: obtain_build
          step: Gép regisztrálása az Autopilotba, hozzárendelés a felhasználóhoz (kb. 1,5 óra).
          who: Szabó Márk
        - activity: design_transition
          step: Ellenőrzés — a jogosultságok a szervezeti egységnek megfelelők, a gép megfelelőségi állapota zöld.
          who: Szabó Márk
        - activity: deliver_support
          step: Átadás az első napon — első bejelentkezés, MFA-regisztráció, gyorssegédlet.
          who: Service Desk
        - activity: improve
          step: Az átfutási idő rögzítése (M5), és ha a cél fölött van, az ok megkeresése.
          who: Varga Eszter, Kiss Réka
      lesson: >
        Ez **szolgáltatáskérés**, nem incidens: előre tervezhető, szabványos lépésekből áll.
        Ha a ticketrendszer ugyanúgy számolja, mint a hibákat, a statisztika torz lesz.
    - id: lost_laptop
      name: Elveszett vagy ellopott laptop
      trigger: A munkatárs bejelenti, hogy a gépe elveszett vagy ellopták.
      outcome: Az adatok nem kerülnek illetéktelen kézbe, a munkatárs mielőbb újra dolgozik.
      metric: >
        A hozzáférés távoli visszavonása kb. 8 perc (runbook 10. eset); egy új gép beüzemelése
        kb. 1,5 óra (M4).
      steps:
        - activity: engage
          step: A bejelentés a Service Desken (belső 4200) — azonnal kiemelt kezelés.
          who: Kiss Réka
        - activity: deliver_support
          step: Távoli hozzáférés-visszavonás és -törlés az Intune-ban, a fiók munkameneteinek lezárása.
          who: Szabó Márk
        - activity: engage
          step: Azonnali értesítés — Nagy Péter és az adatvédelmi tisztviselő (dr. Fekete Zsolt).
          who: Service Desk
        - activity: deliver_support
          step: Az adatvédelmi tisztviselő eldönti, adatvédelmi incidens-e, és kell-e 72 órán belül bejelenteni a NAIH-nak.
          who: dr. Fekete Zsolt
        - activity: obtain_build
          step: Csere-laptop beüzemelése Autopilottal.
          who: Szabó Márk
        - activity: improve
          step: Jegyzőkönyv és tanulság — ha ismétlődik, problémaként kell kezelni.
          who: Nagy Péter
      lesson: >
        Ez **biztonsági incidens**, más eszkalációval, mint egy hétköznapi hiba. Az ITIL
        szóhasználatában ehhez a *kiemelt incidens* és az *információbiztonsági menedzsment*
        gyakorlat tartozik — a Xyo runbookja ezt már jól kezeli.

practices:
  intro: >
    Az ITIL 4 **34 gyakorlatot** ír le, három csoportban: 14 általános menedzsment-, 17
    szolgáltatásmenedzsment- és 3 technikai menedzsment-gyakorlatot. A Foundation-vizsga ebből
    **15-öt** kér: 7-et részletesen, 8-at a céljuk szintjén. Lent mindegyiknél: hol volt jelen a
    Xyo projektben, és mit tenne hozzá az ITIL.
  groups:
    general: Általános menedzsment
    service: Szolgáltatásmenedzsment
    technical: Technikai menedzsment
  foundation:
    - id: continual_improvement
      name_hu: Folyamatos fejlesztés
      name_en: Continual improvement
      group: general
      depth: részletes
      purpose: >
        A szolgáltatások és a gyakorlatok összehangolása a változó üzleti igényekkel — folyamatos,
        kis lépésekben, mindenkinek a feladataként.
      xyo: >
        A tanulságok naplója (19 tanulság, 14 menet közben), a havi mérési riportok és a PIR.
      adds: >
        A projekt végén a fejlesztési ötleteknek nincs gazdája. Az ITIL egy **folyamatos
        fejlesztési nyilvántartást** (CIR) és egy felelőst adna, aki a PIR után is viszi.
      gap: közepes
      docs: [lessons_learned, pir, monthly_measurement_report]
    - id: change_enablement
      name_hu: Változásengedélyezés
      name_en: Change enablement
      group: service
      depth: részletes
      purpose: >
        Az éles szolgáltatások és környezetek változásainak sikeressége: a kockázatok helyes
        felmérése, a változás engedélyezése és a változási ütemterv kezelése. (Korábbi neve:
        change control.)
      xyo: >
        A változáskezelési eljárás a **projekt** hatókörének változásait kezeli. Az éles
        konfiguráció változtatására — például egy feltételes hozzáférési szabály módosítására —
        nincs szabály.
      adds: >
        Változásmodellek: **szabványos** (előre engedélyezett, pl. új belépő), **normál**
        (értékelés és engedély) és **sürgős** változás. A P-05 (három tesztelő kizárása egy
        feltételes hozzáférési szabály miatt) pontosan az a hiba, amit ez megelőz.
      gap: nagy
      docs: [change_procedure, change_log, issue_log]
    - id: incident_management
      name_hu: Incidenskezelés
      name_en: Incident management
      group: service
      depth: részletes
      purpose: >
        Az incidensek negatív hatásának csökkentése a szolgáltatás mielőbbi helyreállításával.
        Incidens: a szolgáltatás nem tervezett megszakadása vagy minőségének romlása.
      xyo: >
        A Service Desk, a runbook 15 leggyakoribb esete és a négyszintű eszkalációs út.
      adds: >
        **Prioritás** a hatás és a sürgősség alapján, és prioritásonként célidő. A kiemelt
        (major) incidensnek csak az adatvédelmi ága van leírva — a szolgáltatáskiesésé nincs.
      gap: közepes
      docs: [operational_handover, rollback_plan]
    - id: problem_management
      name_hu: Problémakezelés
      name_en: Problem management
      group: service
      depth: részletes
      purpose: >
        Az incidensek valószínűségének és hatásának csökkentése: a kiváltó okok feltárása,
        kerülőmegoldások és ismert hibák kezelése. Probléma: egy vagy több incidens oka.
      xyo: >
        Vigyázat, névütközés: a „Problémanapló” a PMI *issue log*-ja — projektakadályok
        nyilvántartása, nem ITIL-problémák. A runbook 7. pontja (ismert korlátok, nyitott
        hibák) viszont már egy kezdetleges ismerthiba-lista.
      adds: >
        Az ismétlődő incidensek (pl. a késő MFA-értesítés) problémaként kezelése, gazdával;
        **ismerthiba-nyilvántartás** kerülőmegoldással, amit a Service Desk használ.
      gap: közepes
      docs: [issue_log, operational_handover, test_report]
    - id: service_request_management
      name_hu: Szolgáltatáskérés-kezelés
      name_en: Service request management
      group: service
      depth: részletes
      purpose: >
        Az előre meghatározott, felhasználó által kezdeményezett kérések hatékony és
        felhasználóbarát teljesítése: információkérés, hozzáférés, szabványos változás.
      xyo: >
        Az új belépő és a kilépő kezelése (runbook 12–13. eset), az önkiszolgáló
        jelszó-visszaállítás. A ticketstatisztika (M1) azonban nem választja szét a kéréseket és
        a hibákat.
      adds: >
        **Kéréskatalógus** és külön számlálás. Ha a kérés és a hiba egy kalap alá kerül, egy
        létszámbővülés hibaszám-növekedésnek látszik.
      gap: közepes
      docs: [operational_handover, kpi_sheet]
    - id: service_desk
      name_hu: Service Desk
      name_en: Service desk
      group: service
      depth: részletes
      purpose: >
        Az incidensek és a szolgáltatáskérések befogadása; egyetlen, egyértelmű kapcsolódási
        pont a szolgáltató és a felhasználók között.
      xyo: >
        Kiss Réka és két munkatárs, belső 4200 és `servicedesk@xyo.hu`; az útmutatót 2 héttel az
        élesítés előtt megkapták, a hypercare-kapacitás egyeztetve volt.
      adds: >
        Kevés: ez a Xyo egyik legjobban működő része. A kiterjesztésnél (190 fő) a kapacitás
        válik kérdéssé — ezt a kiterjesztési javaslat F4 előfeltétele már kimondja.
      gap: kicsi
      docs: [operational_handover, wbs_dictionary, rollout_recommendation]
    - id: service_level_management
      name_hu: Szolgáltatásszint-kezelés
      name_en: Service level management
      group: service
      depth: részletes
      purpose: >
        Világos, üzleti alapú célok a szolgáltatás teljesítményére, és azok rendszeres
        mérése, áttekintése és jelentése.
      xyo: >
        Vannak célok — MTTR ≤ 6,0 óra (M2), rendelkezésre állás ≥ 99,5% (M9), elégedettség ≥ 4,0
        (M11) —, de haszonmérésként, a mérési szakasz végéig. Belső SLA nincs; „SLA” csak a
        Microsoft-szerződésnél szerepel.
      adds: >
        **Belső SLA** a mért adatokból levezetett célokkal, **OLA** a Service Desk és a
        rendszergazda között, és negyedéves **szolgáltatásfelülvizsgálat** a megrendelővel.
      gap: nagy
      docs: [kpi_sheet, pir, operational_handover]
    - id: information_security_management
      name_hu: Információbiztonsági menedzsment
      name_en: Information security management
      group: general
      depth: cél
      purpose: >
        A szervezet üzletmenetéhez szükséges információ védelme: bizalmasság, sértetlenség,
        rendelkezésre állás, hitelesség és letagadhatatlanság.
      xyo: >
        A biztonsági alapkonfiguráció, az adatvédelmi hatásvizsgálat, a 100%-os MFA, a
        break-glass fiókok rendje.
      adds: >
        Kevés — a kiterjesztési javaslat a behatolástesztet (F3) és az adatvesztés-megelőzést (F2)
        már előfeltételnek tette.
      gap: kicsi
      docs: [security_baseline, dpia, operational_handover]
    - id: relationship_management
      name_hu: Kapcsolatkezelés
      name_en: Relationship management
      group: general
      depth: cél
      purpose: >
        A szervezet és az érintettjei közötti kapcsolat kiépítése és ápolása stratégiai és
        taktikai szinten.
      xyo: Az érintett-nyilvántartás, a hatalom–érdek mátrix és a kommunikációs terv.
      adds: >
        A projekt után a kapcsolatnak nincs gazdája. Az ITIL-ben a szolgáltatásgazda (Nagy Péter)
        viszi tovább, a szolgáltatásfelülvizsgálattal.
      gap: kicsi
      docs: [stakeholder_register, stakeholder_analysis, comm_plan]
    - id: supplier_management
      name_hu: Beszállítókezelés
      name_en: Supplier management
      group: general
      depth: cél
      purpose: >
        A beszállítók és teljesítményük megfelelő kezelése, hogy a termékek és szolgáltatások
        zökkenőmentesen működjenek.
      xyo: >
        A beszerzési terv, a szállítóértékelés, a szerződések és a teljesítésigazolások; a
        runbook a szavatossági és garanciális utakat is rögzíti.
      adds: >
        A szerződéses szolgáltatási szintek (Cloudia, TechLine, Microsoft) összekötése a belső
        SLA-val, hogy a külső vállalás ne legyen gyengébb a belsőnél.
      gap: kicsi
      docs: [procurement_plan, contract, operational_handover]
    - id: it_asset_management
      name_hu: IT-eszközgazdálkodás
      name_en: IT asset management
      group: service
      depth: cél
      purpose: >
        Az IT-eszközök teljes életciklusának tervezése és kezelése — érték maximalizálása,
        költség és kockázat kordában tartása.
      xyo: >
        Az 50 laptop leltárszámmal és Autopilot-regisztrációval átvéve (2.3.1); a régi gépek
        selejtezése az üzemeltetésnél maradt.
      adds: >
        Életciklus-terv a gépekre (csereidő, garancia vége), és a licencek nyilvántartása a
        megújítási dátummal.
      gap: kicsi
      docs: [wbs_dictionary, final_acceptance, operational_handover]
    - id: monitoring_event_management
      name_hu: Monitorozás és eseménykezelés
      name_en: Monitoring and event management
      group: service
      depth: cél
      purpose: >
        A szolgáltatások és összetevőik rendszeres megfigyelése, az állapotváltozások
        (események) rögzítése és a megfelelő válasz kiválasztása.
      xyo: >
        A rendelkezésre állás a Microsoft szolgáltatásállapot-jelentéséből származik (M9); a
        break-glass bejelentkezés azonnali riasztást küld.
      adds: >
        Ki figyel mit, milyen küszöbnél, és mi a teendő — ma ez egy ember fejében van.
      gap: közepes
      docs: [kpi_sheet, operational_handover]
    - id: release_management
      name_hu: Kiadáskezelés
      name_en: Release management
      group: service
      depth: cél
      purpose: >
        Új és módosított szolgáltatások és funkciók elérhetővé tétele a felhasználók számára.
      xyo: >
        A három élesítési hullám (10, 20, 20 fő) lényegében három kiadás volt, előre tervezett
        tartalommal és visszaállási lehetőséggel.
      adds: Kevés — a projekt ezt jól csinálta; az ITIL csak a nevét adja.
      gap: kicsi
      docs: [schedule, rollback_plan]
    - id: service_configuration_management
      name_hu: Szolgáltatáskonfiguráció-kezelés
      name_en: Service configuration management
      group: service
      depth: cél
      purpose: >
        Pontos és megbízható információ a szolgáltatások konfigurációjáról és az azokat
        alkotó konfigurációs tételekről — amikor és ahol szükség van rá.
      xyo: >
        Az as-built dokumentáció (XYO-CP-206) a konfigurációt egy időpontban rögzíti; a
        változásokkal nem frissül automatikusan.
      adds: >
        Ki és mikor frissíti a konfigurációs leírást egy változás után — enélkül az as-built
        fél év múlva elavult.
      gap: közepes
      docs: [as_built, operational_handover]
    - id: deployment_management
      name_hu: Telepítéskezelés
      name_en: Deployment management
      group: technical
      depth: cél
      purpose: >
        Új vagy módosított hardver, szoftver, dokumentáció és folyamatok éles környezetbe
        juttatása.
      xyo: Az Autopilot-gépbeüzemelés és az Intune-alkalmazáscsomagok.
      adds: Kevés — az automatizált telepítés eleve dokumentált és megismételhető.
      gap: kicsi
