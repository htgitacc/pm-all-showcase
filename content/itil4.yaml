  lessons:
    - >
      **A projekt jól csinálta a dolgát:** dokumentálta, felelőst adott, átadta, leírta a
      kerülőmegoldást. A hiány nem a projekté, hanem a projekt utáni gazdátlanságé.
    - >
      **A „figyelés alatt” nem állapot, hanem halasztás.** Az ITIL kérdése: mi a kiváltó feltétel,
      és ki dönt, ha teljesül? Például: ha egy hónapban öt ticket ehhez kapcsolódik, szállítói
      bejelentés.
    - >
      **Mérhető lett volna:** ha az incidenseket a problémához kötik, a PIR nem azt írná, hogy az
      M1 „részben” emiatt maradt el, hanem hogy hány ticket. Ezt a ticketrendszerben egyetlen mező
      adja.
