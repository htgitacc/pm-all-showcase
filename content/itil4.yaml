    számít, hogy a módszert egy projektmódszertan adja. A Xyo projekt tehát az ITIL szemében
    ennek a gyakorlatnak egy példánya, amely a szolgáltatás kialakítását és átadását szolgálta.

roles:
  intro: >
    **Kell-e új ember, ha ITIL szerint dolgozunk? A Xyo méreténél nem.** Az ITIL 4 nem ír elő
    szervezeti felépítést és nem nevez meg kötelező munkaköröket: azt mondja, hogy minden
    gyakorlatnak legyen gazdája, és mindenki tudja, miért felel. Egy 240 fős cég kis IT-csapatánál
    ezek **szerepek („kalapok”)**, amelyeket a meglévő emberek viselnek — a projekt alatt és utána is.
  items:
    - role: Szolgáltatásgazda
      role_en: Service owner
      who: Nagy Péter
      what: >
        A „felhőalapú munkahely” szolgáltatás egészéért felel: értékéért, költségéért, fejlesztéséért.
        Ő ül le a megrendelővel a szolgáltatásfelülvizsgálaton.
      load: negyedévente egy felülvizsgálat, havonta a riport átnézése
    - role: Szolgáltatásszint-felelős
      role_en: Service level manager
      who: Kiss Réka
      what: >
        Az SLA célszintjeinek mérése és havi jelentése; a ticketadatok már most nála vannak (M1–M3).
      load: havonta egy riport — a mérési szakaszban már ugyanezt csinálta
    - role: Service Desk vezető
      role_en: Service desk manager
      who: Kiss Réka
      what: Az egyetlen kapcsolódási pont, a bejelentések befogadása, besorolása és első szintű megoldása.
      load: a mostani munkaköre
    - role: Problémagazda
      role_en: Problem manager
      who: Szabó Márk
      what: >
        Az ismétlődő incidensek kiváltó okának felderítése, az ismerthiba-nyilvántartás vezetése,
        szükség esetén szállítói bejelentés.
      load: havonta egy-két óra, ha a probléma nyitott
    - role: Változásengedélyező
      role_en: Change authority
      who: Nagy Péter (normál és sürgős), előre engedélyezve Szabó Márk (szabványos)
      what: >
        Az éles környezet változásainak engedélyezése. A szabványos változásokat (pl. új belépő)
        nem kell egyenként engedélyezni.
      load: heti tizenöt perces egyeztetés; sürgős esetben azonnal
    - role: Konfigurációs tételek gazdája
      role_en: Configuration management
      who: Szabó Márk
      what: Az as-built dokumentáció frissen tartása minden változás után.
      load: változásonként néhány perc, ha a változás lezárásának feltétele
    - role: Beszállítókezelő
      role_en: Supplier manager
      who: Molnár Katalin (szerződés), Nagy Péter (szakmai teljesítés)
      what: A Microsoft (CSP), a Cloudia Solutions és a TechLine Zrt. szerződéseinek és teljesítésének figyelése.
      load: negyedévente, a szolgáltatásfelülvizsgálat előtt
    - role: Információbiztonsági felelős
      role_en: Information security management
      who: Szabó Márk (technikai), dr. Fekete Zsolt (adatvédelem)
      what: >
        A biztonsági alapkonfiguráció betartása, a biztonsági események kezelése. Az adatvédelmi
        tisztviselő nem azonos az információbiztonsági felelőssel — a Xyo-ban ketten osztoznak.
      load: eseményalapú; félévente a break-glass teszt
    - role: Folyamatos fejlesztés gazdája
      role_en: Continual improvement
      who: Nagy Péter (a projekt végén átadja neki Tóth Gergő)
      what: A fejlesztési nyilvántartás vezetése és a javaslatok sorba állítása.
      load: havonta egy rövid átnézés
  concentration: >
    **A valódi kockázat nem a létszám, hanem a koncentráció.** Szabó Márk négy kalapot visel
    (problémagazda, szabványos változások, konfiguráció, technikai biztonság), és a projekt idején is
    ő volt a szűk keresztmetszet (R4 kockázat: belső kapacitáshiány). Az ITIL itt nem új embert
    kér, hanem azt, hogy a szerepek legyenek leírva — így látszik, hol kell helyettes.
  when_new_people: >
    **Mikor kell mégis új ember?** A 190 fős kiterjesztésnél. A pilot Service Desk-terhelése
    hullámonként 3,4 → 2,1 → 1,5 ticket/fő volt; a kiterjesztési javaslat ebből +1 fő tartós Service
    Desk kapacitást számolt (F4 előfeltétel). Ez nem ITIL-követelmény, hanem kapacitásszámítás —
    az ITIL csak azt teszi láthatóvá, hogy a szolgáltatásszint enélkül nem tartható.

expertise:
  intro: >
    **Ki hozza a szakértelmet?** Egy kis csapatban nem egy ITIL-szakértő „hozza be” a módszert,
    hanem a meglévő emberek tanulják meg, és egy-két külső forrás segít az elején.
  items:
    - source: Képzés
      who: Nagy Péter, Kiss Réka, Szabó Márk
      what: >
        ITIL 4 Foundation — a közös nyelv. Nem kell mindenkinek; annak kell, aki gyakorlatot visz.
    - source: A projektmenedzser mint híd
      who: Tóth Gergő
      what: >
        A projekt alatt ő köti össze a két világot: a követelmények közé felveszi a
        szolgáltatásszint-követelményeket, és az átadást elfogadási kritériumokhoz köti.
    - source: A bevezető partner
      who: Cloudia Solutions Kft.
      what: >
        A Microsoft-környezet üzemeltetési tapasztalata: mit érdemes monitorozni, mik a tipikus
        ismert hibák. A szerződésben kérhető, hogy az átadás része legyen.
    - source: Külső felmérés (opcionális)
      who: független tanácsadó
      what: >
        Egy egyszeri érettségi felmérés a kiterjesztés előtt — „kezdd ott, ahol vagy”. A pilotnál
        aránytalan lenne.
    - source: A meglévő anyagok
      who: Xyo
      what: >
        A runbook, a KPI-adatlap és a tanulságok naplója már most ITIL-alapanyag: nem újat kell írni,
        hanem ezeket a gyakorlatokhoz rendelni.

alignment:
  intro: >
    **Kihez és mihez kell igazodni a projekt alatt?** Egy szolgáltatást bevezető projekt nem csak a
    saját tervéhez igazodik. Az ITIL négy dimenziója itt ellenőrzőlistaként működik.
  items:
    - who: Az üzemeltetés (Nagy Péter, Szabó Márk, Service Desk)
      why: >
        Ők viszik tovább a szolgáltatást. Ha az átadás nem az ő elfogadási kritériumaik szerint
        történik, a projekt a saját határidejét teljesíti, de a szolgáltatás akadozik.
    - who: A megrendelő és a felhasználók
      why: >
        A Steering a projekt alatt dönt; utána a szolgáltatásfelülvizsgálat a fórum. A felhasználók
        elvárása a gyorsaság (a kérdőívben a K4 lett a leggyengébb, 3,8).
    - who: A Microsoft szolgáltatása
      why: >
        A felhőben a felelősség megosztott: a platform rendelkezésre állása a Microsofté, a
        konfiguráció és a felhasználók a Xyo-é. A belső SLA nem ígérhet többet, mint amit a
        szolgáltató vállal.
    - who: A szállítói szerződések
      why: >
        A Cloudia Solutions szavatossága és a TechLine következő munkanapos garanciális szervize
        határozza meg, mit lehet belül megígérni.
    - who: Jogszabályok és belső szabályzatok
      why: >
        GDPR és az adatvédelmi tisztviselő (adatvédelmi incidensnél 72 órán belül NAIH-bejelentés),
        a távmunka szabályai, a home office szabályzat, az üzemi tanács véleményezési joga. Ágazattól
        és mérettől függően a kiberbiztonsági törvény is (lásd az összefoglaló magyar fejezetét).
    - who: A cég IT- és biztonsági szabályai
      why: >
        A biztonsági alapkonfiguráció és a break-glass rend nem a projekté — a projekt csak
        bevezeti, az üzemeltetés tartja be.

measurable:
  intro: >
    **Hozhat-e mérhető eredményt az ITIL? Igen — és a Xyo-nál a mérés nagy része már megvan.** Az
    ITIL 4 a szolgáltatás értékét három dolog egyenlegeként írja le: **eredmények** (amit a
    felhasználó és a cég elér), **költségek** és **kockázatok**. A Xyo haszonmérése mindhármat
    mérte — csak nem így nevezte. Az ITIL három dolgot ad hozzá: a mérőszámokat a gyakorlatokhoz
    köti, a projekt után is mért vállalássá teszi őket (SLA), és megmutatja, mit nem lehetett
    eddig mérni.
  kinds:
    eredmény: Amit a felhasználó vagy a cég elér (outcome)
    teljesítmény: Hogyan működik a szolgáltatásnyújtás (output)
    kockázat: Mit véd ki a szolgáltatás
    költség: Mibe kerül
  kpis:
    - {id: M1, name: Ticket / hó, kind: teljesítmény, itil: "Service Desk — kereslet, nem szolgáltatási szint; ezért nem SLA-cél", t0: "103", t3: "74"}
    - {id: M2, name: Átlagos megoldási idő, kind: teljesítmény, itil: "Incidenskezelés — SLA-célszint", practice: incident_management, t0: "11,4 óra", t3: "5,1 óra"}
    - {id: M3, name: Hozzáférési ticketek aránya, kind: teljesítmény, itil: "Szolgáltatáskérés-kezelés — az önkiszolgálás hatása", practice: service_request_management, t0: "41%", t3: "17%"}
    - {id: M4, name: Gépbeüzemelés, kind: teljesítmény, itil: "Telepítéskezelés — automatizált, megismételhető", practice: deployment_management, t0: "6,5 óra", t3: "1,4 óra"}
    - {id: M5, name: Új belépő munkába állása, kind: eredmény, itil: "Értékáram — az „új belépő munkába állítása” elejétől a végéig", t0: "3,5 munkanap", t3: "0,8 munkanap"}
    - {id: M6, name: Home office arány, kind: eredmény, itil: "Üzleti eredmény — a szolgáltatás lehetővé teszi, a kihasználás a szervezeten múlik", t0: "0%", t3: "37%"}
    - {id: M7, name: Adaptáció, kind: eredmény, itil: "Értékrealizálás — használják-e, amit kaptak", t0: "0%", t3: "94%"}
    - {id: M8, name: MFA-lefedettség, kind: kockázat, itil: "Információbiztonsági menedzsment — garancia", practice: information_security_management, t0: "0%", t3: "100%"}
    - {id: M9, name: Rendelkezésre állás, kind: teljesítmény, itil: "Szolgáltatásszint-kezelés — SLA-célszint", practice: service_level_management, t0: "97,8%", t3: "99,6%"}
    - {id: M10, name: Adatvesztés / negyedév, kind: kockázat, itil: "Információbiztonság és folytonosság — SLA-célszint", practice: information_security_management, t0: "0,75", t3: "0"}
    - {id: M11, name: Elégedettség, kind: eredmény, itil: "Szolgáltatásszint- és kapcsolatkezelés — a „dinnye-effektus” ellenszere", practice: relationship_management, t0: "3,1", t3: "4,2"}
    - {id: M12, name: Fajlagos költség, kind: költség, itil: "A szolgáltatás pénzügyei — a megrendelő ebből dönt", t0: "12 667 Ft", t3: "17 633 Ft"}
  sla: >
    **A négy SLA-célszint ezekből jön** — rendelkezésre állás (M9), megoldási idő (M2),
    adatvesztés (M10), elégedettség (M11) —, a mért sorozat alapján. A rendelkezésre állás célja
    mindhárom mért hónapban teljesült; a megoldási időé csak szeptemberben, ezért azon nem
    szigorítottunk. Részletesen: *SLA, OLA és alátámasztó szerződések* (XYO-ITIL-002).
  new_metrics_intro: >
    **Amit eddig nem lehetett mérni.** Ezekhez nincs adat, mert a ticketrendszer nem rögzítette őket
    — a célszámot ezért nem találjuk ki, hanem az első két hónap mérése után rögzítjük, ahol nincs
    más forrás.
  new_metrics:
    - metric: Kérések aránya az összes ticketben
      practice: service_request_management
      why: Az M1 elmaradásának egy része használati kérdés volt — kérés, nem hiba
      data: „Típus” mező a ticketrendszerben (CI-01)
      target: az első két hónap után rögzítjük
    - metric: Célidőn belül megoldott ticketek aránya prioritásonként
      practice: service_level_management
      why: Az átlag elrejti a kiugró eseteket
      data: Prioritás mező minden ticketen (CI-07)
      target: az első negyedév után rögzítjük
    - metric: Első kapcsolatfelvételkor megoldott bejelentések aránya
      practice: service_desk
      why: Megmutatja, mennyit old meg a Service Desk eszkaláció nélkül — és mennyi jut Szabó Márkra
      data: „1. szinten megoldva” jelölés
      target: az első két hónap után rögzítjük
    - metric: Problémához kötött incidensek száma havonta
      practice: problem_management
      why: Enélkül a PIR csak azt írhatja, hogy a késő MFA-értesítés „részben” okozta az M1 elmaradását
      data: A ticket összekötése a PR-01-gyel (XYO-ITIL-004)
      target: kiváltó feltétel — havi öt kapcsolódó bejelentésnél a probléma prioritása magasra emelkedik
    - metric: Sikeres változások aránya
      practice: change_enablement
      why: A változásengedélyezés fő mércéje
      data: Változási nyilvántartás (XYO-ITIL-003)
      target: legalább 95%
    - metric: Sürgős változások aránya
      practice: change_enablement
      why: Ha sok a sürgős, a tervezés gyenge
      data: Változási nyilvántartás (XYO-ITIL-003)
      target: legfeljebb 10%
    - metric: Lezárt fejlesztések, mért hatással
      practice: continual_improvement
      why: A fejlesztés akkor kész, ha a hatását megmérték
      data: Folyamatos fejlesztési nyilvántartás (XYO-ITIL-006)
      target: negyedévente bemutatva a felülvizsgálaton
  not_claimed: >
    **Amit nem állítunk.** Az ITIL-réteg nem javította a Xyo számait — azok a projekt eredményei.
    Az sem igaz, hogy ITIL-lel a kapacitás-haszon pénzzé válna: a PIR helyesen írja, hogy a
    felszabaduló idő csak akkor haszon, ha értékteremtő munkára fordítják. Az ITIL annyit ígér,
    hogy **a mérés a projekt után is megmarad, gazdája lesz, és a hiányzó mérőszámok bekerülnek.**
  verdict: >
    **Ítélet:** mérhető eredményt az ITIL a Xyo-nál nem a számok javításával hoz, hanem azzal,
    hogy a projekt mérési fegyelme — pontos definíciók, előre rögzített torzító tényezők, T0 és
    T+3 — **tartós szolgáltatásmenedzsmentté** válik. A 190 fős kiterjesztésnél ez a különbség
    a „sikeres pilot” és a „működő szolgáltatás” között.

advanced:
  intro: >
    A Foundation a belépő: a fogalmakat és a gyakorlatok célját adja. Aki szolgáltatást vezet,
    tervez vagy fejleszt, annak a haladó szintek szólnak. Ez a fül megmutatja, **mire jók a haladó
    ITIL 4-modulok a Xyo-n**, mennyire érett ma a Xyo szolgáltatásmenedzsmentje, és mi változik az
    **ITIL 5-tel** — hivatalos forrásból ellenőrizve.
  itil4_modules:
    - code: CDS
      name_en: "ITIL 4 Specialist: Create, Deliver and Support"
      focus: Értékáramok tervezése, csapatok és csapatkultúra, a munka sorba állítása és priorizálása.
      xyo: >
        Az „új belépő munkába állítása” értékáram végig tervezve, a HR-igénytől a munkára kész gépig
        (M5: 3,5 → 0,8 munkanap); a Service Desk és a rendszergazda közös munkasora a P1–P4 prioritással.
      who: Kiss Réka, Szabó Márk
    - code: DSV
      name_en: "ITIL 4 Specialist: Drive Stakeholder Value"
      focus: Az ügyfélút a feltárástól az érték realizálásáig; a szolgáltatási kapcsolat és az élmény.
      xyo: >
        A felhasználó útja az oktatástól a T+3 kérdőívig — ahol a sebesség (K4) lett a leggyengébb
        (3,8), és ahol a „mindig elérhető” elvárás megjelent. A kiterjesztés kommunikációja (190 fő).
      who: Nagy Péter, Varga Eszter
    - code: HVIT
      name_en: "ITIL 4 Specialist: High-velocity IT"
      focus: Gyors, digitális szállítás — agilis és DevOps-módszerek, automatizálás.
      xyo: >
        **A Xyo-nál a legkevésbé releváns:** nincs saját fejlesztés, a platform SaaS. Ami átvehető:
        az automatizálás (Autopilot, Intune) mint a megismételhető telepítés alapja a három
        kiterjesztési hullámnál.
      who: Szabó Márk
    - code: DPI
      name_en: "ITIL 4 Strategist: Direct, Plan and Improve"
      focus: Irányítás, értékelés és tervezés, mérés és jelentés, folyamatos fejlesztés, szervezeti változás.
      xyo: >
        **A PM-nek ez a legközelebbi modul.** A Xyo mérési fegyelme (KPI-adatlap, T0, T+3, PIR) és a
        folyamatos fejlesztési nyilvántartás pontosan ennek a modulnak a témája.
      who: Nagy Péter, Tóth Gergő
    - code: DITS
      name_en: "ITIL 4 Leader: Digital and IT Strategy"
      focus: Digitális és IT-stratégia, alkalmazkodás a gyorsan változó környezethez.
      xyo: >
        A pilot maga stratégiai kísérlet volt: kb. 45 M Ft-ért kiderült, megéri-e kb. 133 M Ft-ot
        költeni a teljes szervezetre. A kiterjesztési döntés (2026.10.09.) stratégiai döntés.
      who: Horváth Júlia, Kovács Anita, Nagy Péter
  itil4_designations:
    - name: ITIL 4 Managing Professional
      requires: [CDS, DSV, HVIT, DPI]
      note: Négy modul — a szolgáltatás tervezésétől a működtetésig.
    - name: ITIL 4 Strategic Leader
      requires: [DPI, DITS]
      note: A DPI mindkét úton szerepel, egyszer kell letenni.
    - name: ITIL 4 Practice Manager
      requires: [CDS]
      note: A CDS mellé öt egyéni gyakorlatmodul, vagy egy csomagolt modul (MSF, PIC vagy CAI).
  practice_bundles:
    intro: >
      A Practice Manager csomagolt moduljai öt-öt gyakorlatot fognak össze — **együtt pontosan a
      Foundation 15 gyakorlatát**, amit a Gyakorlatok fül a Xyo-n bemutat. Az ITIL 5 Practice
      Manager moduljai ugyanezt a három csomagot viszik tovább.
    items:
      - code: MSF
        name_en: Monitor, Support and Fulfil
        name_hu: Figyelés, támogatás, teljesítés
        practices: [service_desk, incident_management, problem_management, service_request_management, monitoring_event_management]
        xyo: Kiss Réka szerepköre — a Xyo-ban a legérettebb terület, a problémakezelés kivételével.
      - code: PIC
        name_en: Plan, Implement and Control
        name_hu: Tervezés, megvalósítás, kontroll
        practices: [change_enablement, deployment_management, release_management, service_configuration_management, it_asset_management]
        xyo: Szabó Márk szerepköre — a telepítés kiváló, a változásengedélyezés hiányzott.
      - code: CAI
        name_en: Collaborate, Assure and Improve
        name_hu: Együttműködés, biztosítás, fejlesztés
        practices: [relationship_management, supplier_management, service_level_management, continual_improvement, information_security_management]
        xyo: Nagy Péter szerepköre — itt van a legnagyobb hiány (SLA) és a legjobb alap (mérés).
  maturity:
    intro: >
      **Érettségi önbecslés gyakorlatonként, ötfokú képességskálán.** Ez saját, egyszerűsített
      értékelés a dokumentumok alapján — nem hivatalos ITIL-érettségfelmérés, azt akkreditált
      értékelő végzi. Arra jó, hogy látsszon: hol áll a Xyo, és hová reális eljutni.
    scale:
      - level: 1
        text: Eseti — a gyakorlat céljai részben teljesülnek, egy-egy ember tudására építve
      - level: 2
        text: Ismételhető — az alaptevékenységek leírtak és rendszeresen megtörténnek
      - level: 3
        text: Meghatározott — egységes, gazdája van, mérik és jelentik
      - level: 4
        text: Irányított — a mérőszámok alapján vezérelt, előre jelezhető
      - level: 5
        text: Folyamatosan fejlesztett — a teljesítményt rendszeresen optimalizálják
    ceiling: >
      **A cél sehol nem magasabb a 3-as szintnél.** Egy 240 fős cég kis IT-csapatánál a „meghatározott,
      mért, gazdás” szint a reális és elég — a 4–5. szint mérési és irányítási apparátusa itt
      aránytalan volna. Ez maga is ITIL-irányelv: **kezdd ott, ahol vagy**, és **maradj egyszerű és
      gyakorlatias**.
    items:
      - practice: continual_improvement
        now: 2
        target: 3
        why: Kiváló tanulságnapló és PIR, de a projekt után gazdátlan — a CIR adja a 3-as szintet.
      - practice: change_enablement
        now: 1
        target: 2
        why: Az éles változásokra nem volt szabály; a változásengedélyezési modell leírt alapot ad.
      - practice: incident_management
        now: 2
        target: 3
        why: A Run-book 15 esete és az eszkalációs út megvan; prioritás és kiemelt incidens hiányzott.
      - practice: problem_management
        now: 2
        target: 3
        why: Egy problémát a projekt megoldott (lassú első nap); a késő MFA-értesítés döntés nélkül maradt.
      - practice: service_request_management
        now: 2
        target: 3
        why: A belépő és a kilépő kezelése leírt; a kérések nincsenek külön számolva.
      - practice: service_desk
        now: 3
        target: 3
        why: Felkészített, mért, gazdás — a Xyo egyik legjobban működő része.
      - practice: service_level_management
        now: 1
        target: 2
        why: Célok vannak, de csak haszonmérésként; az SLA leírt alapot ad, a mérés még indul.
      - practice: information_security_management
        now: 3
        target: 3
        why: Biztonsági alapkonfiguráció, adatvédelmi hatásvizsgálat, 100% MFA, break-glass rend.
      - practice: relationship_management
        now: 2
        target: 3
        why: Az érintettkezelés a projektben kiváló volt; a szolgáltatás-felülvizsgálat viszi tovább.
      - practice: supplier_management
        now: 3
        target: 3
        why: Szerződéses kikötések, amelyek bajban megtérültek (helyettesítés, Run-book mint feltétel).
      - practice: it_asset_management
        now: 2
        target: 2
        why: Leltár és Autopilot-regisztráció megvan; életciklus-terv a kiterjesztésnél kell.
      - practice: monitoring_event_management
        now: 1
        target: 2
        why: Havi ellenőrzések vannak, riasztás csak a break-glass belépésre — egy ember fejében van.
      - practice: release_management
        now: 3
        target: 3
        why: A három élesítési hullám tervezett tartalommal és visszaállási lehetőséggel.
      - practice: service_configuration_management
        now: 2
        target: 3
        why: Az as-built pontos, de magától nem frissül; a változás lezárásának feltétele lesz.
      - practice: deployment_management
        now: 3
        target: 3
        why: Automatizált, megismételhető, mért telepítés (Autopilot, 1 óra 22 perc).
  standards:
    - name: ISO/IEC 20000-1
      what: A szolgáltatásmenedzsment-rendszer követelményei — szervezet tanúsítható szerinte.
      xyo: >
        Egy 240 fős, nem IT-szolgáltató cégnél nem szükséges. Akkor kell, ha a Xyo IT-ja
        szolgáltatóként külső ügyfélnek nyújtana szolgáltatást, vagy egy megrendelő megköveteli.
    - name: ISO/IEC 27001
      what: Az információbiztonsági irányítási rendszer követelményei — szervezet tanúsítható szerinte.
      xyo: >
        A biztonsági alapkonfiguráció, az adatvédelmi hatásvizsgálat és a kiterjesztés DLP- és
        behatolásteszt-előfeltétele (F2, F3) jó alap; a tanúsításhoz irányítási rendszer is kell.
    - name: Az ITIL maga
      what: Keretrendszer, nem szabvány — szervezetet nem lehet ITIL szerint tanúsítani, csak személyeket.
      xyo: Egy „ITIL-megfelelőnek” nevezett szervezet valójában ISO/IEC 20000-1 szerint tanúsított.
  itil5:
    intro: >
      **Az ITIL (Version 5) 2026-ban jelent meg.** A PeopleCert megfogalmazásában nem újrakezdés,
      hanem továbbfejlesztés: az ITIL 4 tudása és tanúsítványai érvényesek maradnak.
    changes:
      - topic: Termék és szolgáltatás együtt
        what: >
          A keretrendszer a digitális termékek és szolgáltatások teljes életciklusát kezeli, nem csak a
          szolgáltatásokét.
        xyo: >
          A „Felhőalapú munkahely” egyszerre termék (a beállított környezet, 50 laptop) és szolgáltatás
          (támogatás, SLA) — a Xyo-n ez a kettősség már most látszik.
      - topic: AI-natív
        what: >
          A gyakorlatok, értékáramok és szerepek úgy épülnek fel, hogy a mesterséges intelligencia
          beilleszthető legyen; külön modul szól az MI felelős irányításáról (ITIL AI Governance).
        xyo: A pilotban nem volt MI-elem; a kiterjesztésnél is csak akkor kérdés, ha bevezetnek ilyet.
      - topic: A digitális élmény
        what: A felhasználói élmény a keretrendszer központi témája lett.
        xyo: A Xyo mérte az élményt (M11, kérdőív) — ez a mérés ITIL 5-ben fő helyre kerül.
      - topic: Ami megmarad
        what: >
          A szolgáltatásérték-rendszer és a hét irányelv megmarad; a 34 gyakorlat nagyrészt változatlan,
          két csoportban: termék- és szolgáltatásmenedzsment-, illetve általános menedzsmentgyakorlatok.
        xyo: Minden, ami ezen az oldalon a Xyo-ról szól, ITIL 5-ben is érvényes.
    scheme:
      - name: ITIL Foundation (Version 5)
        requires: belépő — zárt könyves, feleletválasztós vizsga
      - name: ITIL Practice Manager
        requires: Foundation + egy Practice Manager modul (MSF, PIC vagy CAI) + ITIL Transformation
      - name: ITIL Managing Professional
        requires: Foundation + ITIL Product, ITIL Service, ITIL Experience + ITIL Transformation
      - name: ITIL Strategic Leader
        requires: Foundation + ITIL Strategy + ITIL Transformation
      - name: ITIL Master
        requires: mindhárom fenti cím
      - name: ITIL AI Governance
        requires: kiegészítő modul, előfeltétel nélkül; egyik címhez sem tartozik
    facts:
      - Az ITIL 4-modulok kivezetése a PeopleCert jelenlegi terve szerint **2027.12.31.**
      - Az ITIL 4-tanúsítványok **érvényes előfeltételei** az ITIL 5 haladó moduljainak; a Foundationt nem kell újra letenni.
      - Az **ITIL Foundation Bridge (Version 5)** egynapos frissítő az ITIL 4 Foundation birtokosainak; ez is 2027.12.31-ig érhető el.
      - A haladó vizsgák **nyitott könyvesek** (a Practice Manager-moduloknál ez a jelenlegi terv); a Foundation és az MI-irányítási modul kivételével akkreditált képzés kötelező.
      - Az ITIL 5-tanúsítványok **három évre** szólnak; megújítani továbbképzési pontokkal vagy újabb vizsgával lehet — egy ITIL 5-vizsga a meglévő ITIL 4-tanúsítványt is megújítja.
      - Az ITIL Foundation (Version 5) és a Bridge vizsga kilenc nyelven érhető el (angol, spanyol, brazil portugál, kínai, német, francia, lengyel, olasz, japán) — **magyarul még nem.**
    advice: >
      **Mit jelent ez egy magyar jelöltnek 2026 végén?** A hazai hirdetések ma ITIL 4-et kérnek, és
      az ITIL 5 Foundation magyarul még nem érhető el. Az **ITIL 4 Foundation** ezért ma is jó
      választás: 2027 végéig letehető, és érvényes előfeltétel az ITIL 5 haladó moduljaihoz. Később
      egy egynapos Bridge-dzsel vagy egy ITIL 5 haladó modullal frissíthető.
    sources:
      - "PeopleCert: ITIL (Version 5) — FAQ — https://www.peoplecert.org/help-and-support/faq-itil"
      - "PeopleCert: New ITIL explained — https://www.peoplecert.org/news-and-announcements/itil-version-5-explained"
      - "ITIL.com: ITIL 4 Managing Professional — https://www.itil.com/professionals/certifications/itil-4-managing-professional"
      - "ITIL.com: ITIL 4 Practice Manager — https://www.itil.com/professionals/certifications/itil-4-practice-manager"
  verdict: |
    **Megérte volna a Xyo projektet ITIL 4-gyel kiegészíteni? A pilotnál részben, a kiterjesztésnél igen.**

    Egy 50 fős pilotnál a teljes ITIL-apparátus — testület, sok szerep, érettségi program —
    **aránytalan lett volna**. A projekt nagy részét amúgy is jól csinálta: Service Desk-bevonás,
    Run-book, hypercare mérhető kilépéssel, szállítói kikötések.

    **Ami kis ráfordítással megérte volna, már a pilotnál:** a belső **SLA** a meglévő KPI-kból, a
    **változásengedélyezés** egyszerű modellje (a P-05 megelőzésére), és az **ismert hibák**
    határidővel vagy kiváltó feltétellel (a késő MFA-értesítés ne maradjon négy hónapig döntés nélkül).
    Ez a hat mintadokumentum közül három — néhány nap munka.

    **A kiterjesztésnél** (190 fő, három hullám, 2027 januártól szeptemberig) ezek már nem
    választhatók: a Service Desk-kapacitás (F4), a hullámonkénti hypercare és a 240 fős szolgáltatás
    SLA nélkül nem vezethető.

    **A PM szerepe:** a projektmenedzsernek a **Foundation-szint elég**, de azt értenie kell — a
    projekt átadása ezen a nyelven értelmezhető. A haladó szint (DPI, CDS) a szolgáltatás
    vezetőjének, Nagy Péternek szól. **ITIL 4 + PRINCE2 + Waterfall együtt működik**, ha mindegyik
    a saját kérdésére felel: a PMI a technikára, a PRINCE2 a kormányzásra, az ITIL a projekt utáni
    életre.

project_changes:
  intro: >
    **Mit változtat a projekten, ha ITIL-szemlélettel visszük?** Nem a módszertant cseréli le —
    a PMI-technikák és a fázisok maradnak —, hanem öt ponton bővíti, és mindegyik a szolgáltatás
    átadhatóságát szolgálja.
  items:
    - what: A szolgáltatásgazda az első naptól ott van
      detail: Nagy Péter a Steering tagja volt — ITIL-szemmel szolgáltatásgazdaként is, aki az átadást előre átveszi.
    - what: A követelmények közé bekerülnek a garancia-követelmények
      detail: Nem csak az, *mit* tud a rendszer, hanem hogy milyen rendelkezésre állással, megoldási idővel és támogatással.
    - what: Az átadás elfogadási kritériumokhoz kötött
      detail: A runbook mellé szolgáltatási elfogadási kritériumok és a korai életszakasz-támogatás (a hypercare) kilépési feltétele.
    - what: Az éles változásokat a hullámok alatt is engedélyezni kell
      detail: A projekt hatókör-változása és az éles konfiguráció változása két külön döntés.
    - what: A zárás nem a vég, hanem az átadás
      detail: Aláírt belső SLA, átadott ismerthiba-lista és folyamatos fejlesztési nyilvántartás gazdával.

together:
  intro: |
    **Működhet együtt a PMI, a PRINCE2 és az ITIL 4? Igen — mert nem ugyanarra a kérdésre felelnek.**
    A három módszertan három réteg ugyanazon a munkán. A gyakorlatban így dolgoznak együtt a magyar
    nagyvállalati és közszférás IT-projektek többségében is: a projektet PMI-technikákkal tervezik,
    PRINCE2-szerű irányítással vezetik, és az eredményt ITIL szerint üzemeltetik.
  layers:
    - question: Mire válaszol?
      pmi: Mit tudjon a projektmenedzser? — technikák
      prince2: Hogyan irányítsuk a projektet? — kormányzás
      itil: Hogyan teremtsen értéket a szolgáltatás? — életciklus
    - question: Meddig tart?
      pmi: A projekt végéig
      prince2: A projekt végéig
      itil: Amíg a szolgáltatás él
    - question: Ki dönt?
      pmi: Szponzor, Steering Committee
      prince2: Project Board (Executive)
      itil: Szolgáltatásgazda és megrendelő, a szolgáltatásfelülvizsgálaton
    - question: Mi a siker?
      pmi: Határidő, költség, hatókör, minőség
      prince2: Az üzleti indokoltság fennáll, a toleranciákon belül maradtunk
      itil: A fogyasztó eléri a kívánt eredményt — mérve, folyamatosan
    - question: A Xyo-ban
      pmi: A 69 dokumentum, a checklist, a Gantt és a WBS
      prince2: A PRINCE2-réteg — szakaszok, toleranciák, kivételjelentés
      itil: Ez a réteg — szolgáltatás, SLA, változásengedélyezés, problémakezelés
  concept_map:
    - pmi: Project Charter
      prince2: PID (a része)
      itil: Szolgáltatásleírás
      note: A Charter a projektet indítja; a szolgáltatásleírás azt, ami utána marad.
    - pmi: Sponsor, Steering Committee
      prince2: Executive, Project Board
      itil: Megrendelő, szolgáltatásgazda
      note: A projekt döntéshozói a zárással szerepüket vesztik; a szolgáltatásé megmarad.
    - pmi: Deliverable
      prince2: Product
      itil: Kimenet (output), szolgáltatásajánlat
      note: Az ITIL a kimenet helyett az eredményt (outcome) méri.
    - pmi: Acceptance criteria
      prince2: Quality criteria (termékleírás)
      itil: Szolgáltatási elfogadási kritériumok, szolgáltatásszint-követelmények
      note: A projekt „kész”-e kérdése mellett az is, hogy „üzemeltethető”-e.
    - pmi: Change Request (hatókör)
      prince2: Issue — Request for Change
      itil: Változás (change) — változásengedélyezés
      note: A projekt a terv változását kezeli, az ITIL az éles környezetét. Két külön döntés.
    - pmi: Issue Log (problémanapló)
      prince2: Issue Register
      itil: Incidens, probléma, ismert hiba
      note: Névütközés — a PMI „problémanaplója” nem ITIL-probléma.
    - pmi: Defect (hiba a tesztben)
      prince2: Off-specification, concession
      itil: Ismert hiba kerülőmegoldással
      note: Az élesítéskor nyitva hagyott hiba az üzemeltetésben ismert hibaként él tovább.
    - pmi: Status Report
      prince2: Highlight Report
      itil: Szolgáltatásszint-riport, szolgáltatásfelülvizsgálat
      note: A projekt a tervhez, az ITIL a megállapodott szolgáltatási szinthez méri az állapotot.
    - pmi: Hypercare
      prince2: (nincs)
      itil: Korai életszakasz-támogatás (early life support)
      note: Ugyanaz a gondolat; az ITIL a kilépési feltételt is kéri.
    - pmi: Lessons Learned Register
      prince2: Lessons Log, Lessons Report
      itil: Folyamatos fejlesztési nyilvántartás (CIR)
      note: A tanulság a projekt végén lezárul; a fejlesztési javaslat gazdát kap.
    - pmi: Benefits Realisation Plan
      prince2: Benefits Management Approach
      itil: Érték, eredmények, mérés és jelentés
      note: A Xyo haszonmérése (M1–M12) lényegében már ITIL-szemléletű.
    - pmi: Risk Register
      prince2: Risk Register
      itil: Kockázatmenedzsment-gyakorlat
      note: Azonos gondolat; az ITIL-ben a projekt után is él.
  handover_points:
    intro: >
      A projekt és a szolgáltatás hét ponton ér össze. Mindegyiknél az a kérdés, ki adja és ki veszi át.
    items:
      - when: Tervezés
        what: Szolgáltatásszint-követelmények a követelménymátrixban
        from: Tóth Gergő
        to: Nagy Péter, Kiss Réka
      - when: Megvalósítás
        what: A szabványos változások listája (pl. új belépő, kilépő)
        from: Cloudia Solutions, Szabó Márk
        to: Nagy Péter (változásengedélyező)
      - when: Minden élesítési hullám előtt
        what: Go / no-go döntés — projektdöntés és éles változás egyszerre
        from: Tóth Gergő
        to: Nagy Péter
      - when: Zárás
        what: Nyitott hibák átadása ismert hibaként, kerülőmegoldással
        from: Projekt (tesztjegyzőkönyv)
        to: Szabó Márk (problémagazda), Service Desk
      - when: Zárás
        what: A korai életszakasz-támogatás (hypercare) kilépési feltétele
        from: Tóth Gergő
        to: Kiss Réka
      - when: Zárás
        what: Belső SLA és OLA aláírva
        from: Tóth Gergő
        to: Nagy Péter (szolgáltatásgazda), Horváth Júlia (megrendelő)
      - when: A haszonmérés végén
        what: Folyamatos fejlesztési nyilvántartás gazdával
        from: Tóth Gergő
        to: Nagy Péter
  conflicts:
    - topic: Projekt-változáskérelem vagy üzemeltetési változás?
      resolution: >
        A projekt hatóköréről a projekt dönt (a Xyo változáskezelési eljárása szerint), az éles
        konfigurációról a változásengedélyező. A hullámok alatt mindkettő él: egy jóváhagyott
        projekt-változáskérelem nem engedélyezi automatikusan az éles módosítást.
    - topic: Projekt-issue, incidens vagy probléma?
      resolution: >
        Amíg a projekt fut, a hullámokban talált hibák projekt-issue-k (problémanapló). Az élesben
        dolgozó felhasználó bejelentése viszont már incidens — a Service Desk kezeli, akkor is, ha a
        projekt még nem zárult le. Ha ugyanaz az ok többször visszajön, problémarekord kell.
    - topic: Steering vagy szolgáltatásfelülvizsgálat?
      resolution: >
        A projekt végéig a Steering dönt; az átadástól a szolgáltatásgazda és a megrendelő
        negyedéves felülvizsgálata. A kettő a zárás hónapjában fedi egymást — ezért kell az
        átadásnak dátuma.
    - topic: Projekt-siker vagy szolgáltatás-siker?
      resolution: >
        A Xyo projekt határidőre, a keret alatt zárult (2026.06.30.). Hogy a szolgáltatás értéket
        teremt-e, azt a PIR mondta meg három hónappal később. Az ITIL azt kéri, hogy ez a kérdés a
        PIR után se szűnjön meg.

error_journey:
  title: Egy hiba útja a három módszertanon át — a késő MFA-értesítés (H-09 / P-13)
  intro: >
    Egy valós, kicsi hiba a Xyo projektből. Végigkövetve megmutatja, hol áll meg a projekt
    felelőssége, és hol kezdődik a szolgáltatásé — és miért maradt nyitva négy hónap után is.
  steps:
    - when: 2026. május, tesztelés
      what: Az Authenticator-értesítés néha 30+ másodperces késéssel érkezik.
      pmi: Hiba a tesztjegyzőkönyvben (H-09, S3 — zavaró), szolgáltatói oldali, „figyelés alatt”.
